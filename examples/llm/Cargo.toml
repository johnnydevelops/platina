[package]
name = "llm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "llm-native"
path = "src/native.rs"

# the in-game server/client (src/roblox_main.rs) is only built for Roblox
[target.'cfg(target_vendor = "roblox")'.dependencies]
roblox = { path = "../../crates/roblox" }

[profile.release]
debug = false
panic = "abort"

[workspace]

[[bin]]
name = "chat-native"
path = "src/chat_native.rs"
